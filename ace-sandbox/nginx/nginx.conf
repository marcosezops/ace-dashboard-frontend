events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend {
        server frontend:4173;
    }

    upstream backend {
        server backend:8080;
    }

    upstream gateway {
        server db-gateway:3031;
    }

    server {
        listen 80;
        server_name _;  # Accept any host (localhost or Daytona sandbox URLs)

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Increase buffer size for large headers (JWT tokens)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Common proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # =====================
        # STATIC FILES - /tests
        # Serve images and static files from tests folder
        # =====================
        
        location /tests/ {
            alias /var/www/tests/;
            autoindex on;
            try_files $uri $uri/ =404;
        }

        # =====================
        # BACKEND (ace-stack-backend)
        # Routes: /api/*, /auth/*, /integrations/*, /commands-history/*
        # =====================
        
        location /api/ {
            proxy_pass http://backend;
        }

        location /auth/ {
            proxy_pass http://backend;
        }

        # Only /integrations/github/* goes to backend (OAuth callbacks)
        location /integrations/github/ {
            proxy_pass http://backend;
        }

        location /commands-history/ {
            proxy_pass http://backend;
        }

        # =====================
        # DB GATEWAY (ace-db-gateway)
        # Access via /gateway/* -> strips /gateway and forwards to service
        # Ex: /gateway/api/users -> /api/users on db-gateway
        # =====================
        
        location /gateway/ {
            rewrite ^/gateway/(.*) /$1 break;
            proxy_pass http://gateway;
        }

        # =====================
        # FRONTEND (ace-dashboard-frontend)
        # Everything that doesn't match above routes goes to frontend
        # SPA fallback - all unmatched routes go to index.html
        # =====================
        
        location / {
            proxy_pass http://frontend;
            
            # Host header - passes original host for Vite allowedHosts (VITE_FRONTEND_URL)
            proxy_set_header Host $host;
            
            # WebSocket support (for HMR in dev)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for long connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # SPA fallback - intercept 404 from upstream and retry at /
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }
        
        # SPA fallback location - redirect 404s to index.html
        location @spa_fallback {
            rewrite ^(.*)$ / break;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
