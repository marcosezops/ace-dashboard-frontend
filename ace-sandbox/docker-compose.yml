services:
  # 3432:5432 root root_password
  postgres:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:postgres-17.4-alpine
    container_name: ace-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root_password
    ports:
      - "3432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistência do PostgreSQL
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ace-network

  # 3379:6379
  redis:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:redis-7-alpine
    container_name: ace-redis
    restart: always
    ports:
      - "3379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ace-network

  # 3030
  configuration:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:node-20
    container_name: ace-configuration
    restart: no
    environment:
      DATABASE_URL: postgres://root:root_password@postgres:5432/configuration
      DB_LOGGING: true
      DB_USE_SSL: false
      DB_SSL_STRICT: false
      PORT: 3030
      DB_HOST: postgres
      DB_USERNAME: root
      DB_PASSWORD: root_password
      DB_DATABASE: configuration
      DB_DIALECT: postgres
      NODE_ENV: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_PREFIX: "demo:"
    volumes:
      - ${ACE_CONFIGURATION_PATH:-/root/ace-workspace/ace-configuration}:/app
    ports:
      - "3030:3030"
    user: "root"
    working_dir: /app
    command: sh -c "yarn install && yarn start:configuration"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ace-network

  # 3031
  db-gateway:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:node-20
    container_name: ace-db-gateway
    restart: always
    environment:
      CONFIGURATION_DB_URL: postgres://root:root_password@postgres:5432/configuration
      LLM_DB_URL: postgres://root:root_password@postgres:5432/llmdatabase
      PORT: 3031
      REDIS_HOST: redis
      SECRET_PATH_PREFIX: /ace/dev/secrets/local-env/
      BACKEND_DB_GATEWAY_TOKEN: BACKEND-DB_GATEWAY-TOKEN
      ENCRYPTION_KEY: xO9Ysm33kv5y7vWVlDnnYBvRcf54xX5c
    volumes:
      - ${ACE_DB_GATEWAY_PATH:-/root/ace-workspace/ace-db-gateway}:/app
    ports:
      - "3031:3031"
    user: "root"
    working_dir: /app
    command: sh -c "yarn install && yarn dev"
    networks:
      - ace-network

  # 3041:8080
  backend:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:node-20
    container_name: ace-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: root
      DB_NAME: dashboard
      DB_PASSWORD: root_password
      JWT_SECRET: a1b2c3d4-e5f6-7890-1234-567890abcdef
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-your-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-your-github-client-secret}
      # With nginx (port 80):
      API_HOST: ${API_HOST:-http://localhost}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      SES_FROM_EMAIL: noresponse@web.ace.ezops.cloud
      SES_REGION: us-east-1
      AWS_REGION: us-east-1
      PORT: 8080
      DB_SSL_ENABLED: false
      ACE_GATEWAY_URL: http://db-gateway:3031
      ACE_GATEWAY_TOKEN: BACKEND-DB_GATEWAY-TOKEN
      LLM_URL: http://fake-llm:8080
      REDIS_URL: redis://redis:6379
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-your-slack-bot-token}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-your-slack-signing-secret}
      WIKI_JS_URL: ${WIKI_JS_URL:-https://wiki-dev.ace.ezops.cloud}
      WIKI_JS_GRAPHQL_URL: ${WIKI_JS_GRAPHQL_URL:-https://wiki-dev.ace.ezops.cloud/graphql}
      WIKI_JS_API_KEY: ${WIKI_JS_API_KEY:-your-wiki-js-api-key}
    volumes:
      - ${ACE_BACKEND_PATH:-/root/ace-workspace/ace-stack-backend}:/app
    ports:
      - "3041:8080"
    user: "root"
    working_dir: /app
    command: sh -c "yarn install && /app/entrypoint.sh"
    networks:
      - ace-network
    
  # 3042:4173
  frontend:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:node-20
    container_name: ace-frontend
    restart: no
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost}
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost}
      VITE_ACE_GATEWAY_URL: ${VITE_ACE_GATEWAY_URL:-http://localhost}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost}
      VITE_LLM_URL: ${VITE_LLM_URL:-http://localhost/api}
    volumes:
      - ${ACE_FRONTEND_PATH:-/root/ace-workspace/ace-dashboard-frontend}:/app
    ports:
      - "3042:4173"
    user: "root"
    working_dir: /app
    command: sh -c "yarn install && /app/entrypoint.sh"
    networks:
      - ace-network
    extra_hosts:
      - "ace-nginx:127.0.0.1"

  nginx:
    image: 975635808270.dkr.ecr.us-east-1.amazonaws.com/ace/base-images:nginx-alpine
    container_name: ace-nginx
    restart: always
    user: "root"
    pull_policy: if_not_present
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/${NGINX_CONFIG:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ${TESTS_PATH:-/root/tests}:/var/www/tests:ro
    depends_on:
      - frontend
      - backend
      - db-gateway
      - configuration
    networks:
      - ace-network
    extra_hosts:
      - "ace-nginx:127.0.0.1"

networks:
  ace-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
